app:
  name: "AI Swing Stock Analyzer"
  default_symbol: "RELIANCE.NS"
  default_period: "2y"
  default_interval: "1d"

strategy:
  horizon_days: 5
  probability_threshold: 0.60
  high_confidence_threshold: 0.70
  stop_loss_pct: 0.03
  target_pct: 0.06
  risk_per_trade: 0.01
  transaction_cost: 0.001
  slippage: 0.0005
  initial_capital: 100000

features:
  ema_fast: 20
  ema_slow: 50
  ema_long: 200
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  bb_period: 20
  volume_period: 20
